<!DOCTYPE html>
<html lang="ja">
<head>

<style>

  .brow { display:flex; gap:8px; align-items:center; }
  .brow .hint { flex:1; font-size:12px; line-height:1.4; }
  #objbar { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(196px + env(safe-area-inset-bottom)); display:none; gap:6px; background:#fff;

  #objbar b { font-size:14px; margin:0 6px; }

  @keyframes tin { from { opacity:0; transform:translateY(-8px); } }
  #talk { position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom)); transform:translateX(-50%); width:min(92%,520px); background:#fff; border-radius:18px;
    padding:14px 16px 22px; box-shadow:0 6px 24px rgba(0,0,0,.2); display:none; z-index:25; font-size:17px; line-height:1.6; box-sizing:border-box; }
  #talk.show { display:block; }
  #talk .who { position:absolute; top:-14px; left:16px; background:var(--accent); color:#fff; font-weight:700; padding:3px 12px; border-radius:10px; font-size:13px; }
  #talk .nx { position:absolute; right:14px; bottom:6px; font-size:12px; animation:pulse 1s infinite; }
  #fade { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity .45s; z-index:24; }
  #fade.on { opacity:1; }
</style>
</head>

<script>

// ---------- 便利関数 ----------
const rand = (a,b) => a + Math.random()*(b-a);

function seeded(seed){ let s = (Math.floor(seed*99991) % 2147483646) + 1; return () => (s = (s*16807) % 2147483647) / 2147483647; }
const $ = id => document.getElementById(id);

  W.residents = residents.map(r => ({ id:r.id, name:r.name, look:Object.assign({}, r.look), act:r.act, care:r.care, fav:r.fav, dislike:r.dislike,
    level:r.level, happy:Math.round(r.happy), hunger:Math.round(r.hunger), home:r.home, room:r.room }));
  W.objects = [...objs.values()].map(o => ({ id:o.id, t:o.t, ox:o.ox, oz:o.oz, rot:o.rot }));
  W.land = [...landSet];
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(W)); } catch(e) {}

const HR = 0.6;  // 頭の半径
function shapeDir(x, y, z, shape){
  switch (shape){
    case 'oval': return [x*0.93, y*1.1, z*0.96];
    case 'square': { const k = Math.pow(x**4 + y**4 + z**4, 0.25); const f = lerp(1, 1/k, 0.6)*0.93; return [x*f, y*f*1.02, z*f]; }
    case 'sharp': { if (y < 0){ const t = Math.pow(-y, 1.2); return [x*(1 - 0.32*t), y*1.08, z*(1 - 0.1*t)]; } return [x, y*1.02, z]; }
    case 'wide': { const t = y < 0 ? -y : 0; return [x*(1.08 + 0.08*t), y*0.95, z*(1.02 + 0.04*t)]; }
    default: return [x, y, z];
  }
}
function deformGeo(geo, shape){
  if (shape === 'round') return geo;
  const p = geo.attributes.position, a = p.array;
  for (let i = 0; i < p.count; i++){
    const x = a[i*3], y = a[i*3+1], z = a[i*3+2], r = Math.hypot(x, y, z) || 1;
    const [nx, ny, nz] = shapeDir(x/r, y/r, z/r, shape);
    a[i*3] = nx*r; a[i*3+1] = ny*r; a[i*3+2] = nz*r;
  }
  p.needsUpdate = true; geo.computeVertexNormals();
  return geo;
}
const geoCache = {};
function cgeo(key, make){ return geoCache[key] || (geoCache[key] = make()); }
const CG = {
  leg: new THREE.CylinderGeometry(0.1, 0.085, 1, 10), torso: new THREE.CylinderGeometry(0.24, 0.3, 1, 18),
  arm: new THREE.CylinderGeometry(0.075, 0.068, 1, 8), ball: new THREE.SphereGeometry(1, 16, 12),
  neck: new THREE.CylinderGeometry(0.085, 0.09, 0.2, 8), skirt: new THREE.CylinderGeometry(0.26, 0.46, 0.38, 18, 1, true),

// 髪型: [半径倍率, 顔まわりのあき, うしろの長さ]
const HAIR = {
  short:[1.07, 0.95, 1.85], buzz:[1.03, 1.0, 1.75], bob:[1.12, 0.85, 2.25], long:[1.1, 0.85, 2.2], pony:[1.07, 0.95, 1.85], twin:[1.07, 0.95, 1.85],
  bun:[1.07, 0.95, 1.85], spiky:[1.07, 0.95, 1.8], fluffy:[1.1, 0.9, 1.95], afro:[1.38, 1.15, 2.1],

function hairTop(L){ const h = HAIR[L.hair]; return HR*(h ? h[0] : 1)*shapeDir(0, 1, 0, L.face)[1]; }
function buildHair(L){
  const g = new THREE.Group();
  const hp = HAIR[L.hair]; if (!hp) return g;
  const m = toon(L.hairColor, true);
  const [rf, ex, back] = hp, top = L.hair === 'afro' ? 0.75 : 0.8;
  const sx = shapeDir(1, 0, 0, L.face)[0], sy = shapeDir(0, 1, 0, L.face)[1];
  const cap = cgeo(`cap|${L.hair}|${L.face}`, () => deformGeo(new THREE.SphereGeometry(HR*rf, 32, 10, 0, Math.PI*2, 0, top), L.face));
  const bk = cgeo(`bk|${L.hair}|${L.face}`, () => deformGeo(new THREE.SphereGeometry(HR*rf, 32, 16, Math.PI/2 + ex, Math.PI*2 - ex*2, top - 0.05, back - top + 0.05), L.face));
  g.add(mesh(cap, m), mesh(bk, m));
  if (L.hair === 'long'){
    const p = mesh(cgeo('longback', () => new THREE.CylinderGeometry(HR*1.02, HR*1.22, 1.1, 20, 1, true, Math.PI - 1.35, 2.7)), m, 0, -HR*0.35 - 0.5, 0); p.scale.x = sx; g.add(p);
    for (const s of [-1, 1]){ const st = mesh(CG.ball, m, s*HR*0.95*sx, -HR*0.75, HR*0.25); st.scale.set(0.13, 0.42, 0.13); g.add(st); }
  } else if (L.hair === 'pony'){
    const t = mesh(CG.ball, m, 0, -0.05, -HR*1.25); t.scale.set(0.2, 0.46, 0.2); t.rotation.x = 0.35; g.add(t);
    const tie = mesh(CG.ball, toon('#e5534b'), 0, 0.22, -HR*1.04); tie.scale.setScalar(0.07); g.add(tie);
  } else if (L.hair === 'twin'){
    for (const s of [-1, 1]){
      const t = mesh(CG.ball, m, s*HR*1.2*sx, -0.12, -HR*0.25); t.scale.set(0.18, 0.46, 0.18); t.rotation.z = s*0.25; g.add(t);
      const tie = mesh(CG.ball, toon('#e5534b'), s*HR*1.03*sx, 0.18, -HR*0.25); tie.scale.setScalar(0.07); g.add(tie);
    }
  } else if (L.hair === 'bun'){
    const b = mesh(CG.ball, m, 0, HR*1.1*sy, -HR*0.3); b.scale.setScalar(0.25); g.add(b);
  } else if (L.hair === 'spiky'){
    const cg = cgeo('spike', () => new THREE.ConeGeometry(0.13, 0.36, 6));
    const up = new THREE.Vector3(0, 1, 0);

      const th = 0.3 + (i % 2)*0.45, ph = i*2.4;

      const dir = new THREE.Vector3(Math.sin(th)*Math.cos(ph), Math.cos(th), Math.sin(th)*Math.sin(ph));
      if (dir.z > 0.45) continue;
      const b = mesh(CG.ball, m, dir.x*HR*1.05*sx, dir.y*HR*1.08*sy, dir.z*HR*1.05); b.scale.setScalar(0.2); g.add(b);
    }
  }
  return g;
}

function fitHat(hat, L){

// ---------- 顔の絵 ----------
const INK = '#2a2230';
function ell(c, x, y, rx, ry, rot=0){ c.beginPath(); c.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, Math.PI*2); c.fill(); }
function heart(c, x, y, s){
  c.beginPath(); c.moveTo(x, y + s*0.9);
  c.bezierCurveTo(x - s*1.6, y - s*0.2, x - s*0.7, y - s*1.3, x, y - s*0.45);
  c.bezierCurveTo(x + s*0.7, y - s*1.3, x + s*1.6, y - s*0.2, x, y + s*0.9); c.fill();
}
const EYE_SHAPES = {
  round:{ w:13, h:14 }, big:{ w:14, h:18 }, almond:{ w:17, h:10, lens:true, tilt:0.08 }, cat:{ w:16, h:9.5, lens:true, tilt:0.32 },
  droopy:{ w:15, h:10, lens:true, tilt:-0.26 }, narrow:{ w:16, h:5.5, lens:true }, sleepy:{ w:14, h:12, half:true },
};
function eyePath(c, sh, w, h, upperOnly){
  c.beginPath();
  if (sh.lens){ c.moveTo(-w, 0); c.quadraticCurveTo(0, -h*2, w, 0); if (!upperOnly) c.quadraticCurveTo(0, h*2, -w, 0); }
  else if (upperOnly) c.ellipse(0, 0, w, h, 0, Math.PI*1.02, Math.PI*1.98);
  else c.ellipse(0, 0, w, h, 0, 0, Math.PI*2);
}
function drawEye(c, x, y, side, L, expr){
  const s = L.eyeSize;
  c.save(); c.translate(x, y);
  c.strokeStyle = INK; c.fillStyle = INK;
  if (expr === 'happy'){ c.lineWidth = 5.5; c.beginPath(); c.arc(0, 8*s, 12*s, Math.PI*1.15, Math.PI*1.85); c.stroke(); c.restore(); return; }
  if (expr === 'sleep'){
    c.lineWidth = 5; c.beginPath(); c.arc(0, -6*s, 12*s, Math.PI*0.2, Math.PI*0.8); c.stroke();
    if (L.lashes){ c.lineWidth = 2.5; for (let k = 0; k <= L.lashes; k++){ const px = side*(7 + k*3)*s; c.beginPath(); c.moveTo(px, 3*s); c.lineTo(px + side*5, 7*s + k*2); c.stroke(); } }
    c.restore(); return;
  }
  if (expr === 'love'){ c.fillStyle = '#ff4d6d'; heart(c, 0, 2, 14*s); c.restore(); return; }
  const st = expr === 'surprise' ? 'round' : L.eyes;
  if (st === 'dot'){ ell(c, 0, 2, 6*s, 7*s); c.restore(); return; }
  const sh = EYE_SHAPES[st] || EYE_SHAPES.round;
  let w = sh.w*s, h = sh.h*s;
  if (expr === 'surprise'){ w *= 1.15; h *= 1.25; }
  c.rotate(-side*(sh.tilt || 0));
  eyePath(c, sh, w, h); c.fillStyle = '#ffffff'; c.fill();
  c.save(); eyePath(c, sh, w, h); c.clip();
  const ir = Math.min(sh.lens ? h*1.15 : h*0.92, w*0.78), iy = sh.half ? h*0.3 : (sh.lens ? h*0.1 : h*0.08);
  c.fillStyle = L.eyeColor; ell(c, 0, iy, ir*0.9, ir);
  c.fillStyle = INK; ell(c, 0, iy, ir*0.45, ir*0.52);
  c.fillStyle = '#ffffff'; ell(c, ir*0.35, iy - ir*0.42, ir*0.28, ir*0.28); ell(c, -ir*0.3, iy + ir*0.45, ir*0.12, ir*0.12);
  if (sh.half){ c.fillStyle = L.skin; c.fillRect(-w - 2, -h - 4, w*2 + 4, h*0.95); }
  c.restore();
  c.strokeStyle = INK; c.lineWidth = 4;
  if (sh.half){ c.beginPath(); c.moveTo(-w, -h*0.05); c.quadraticCurveTo(0, -h*0.2, w, -h*0.05); c.stroke(); }
  else { eyePath(c, sh, w, h, true); c.stroke(); }
  if (L.lashes){
    const n = L.lashes === 2 ? 3 : 2, len = L.lashes === 2 ? 8 : 5;
    c.lineWidth = 2.6;
    for (let k = 0; k < n; k++){
      const t = 0.62 + k*0.16, px = side*w*t;
      const py = sh.half ? -h*0.08 : sh.lens ? -h*(1 - t*t) : -h*Math.sqrt(Math.max(0, 1 - t*t));
      c.beginPath(); c.moveTo(px, py); c.lineTo(px + side*len*0.85, py - len*0.75 + k*2.2); c.stroke();
    }
  }
  c.restore();
}
function drawBrow(c, x, y, side, L, expr){
  let shape = L.brows;
  if (expr === 'sad') shape = 'worried';
  if (expr === 'angry') shape = 'sharp';
  if (expr === 'surprise') y -= 6;
  const col = L.hair === 'bald' ? '#5a3a22' : '#' + new THREE.Color(L.hairColor).multiplyScalar(0.85).getHexString();
  c.strokeStyle = col; c.fillStyle = col; c.lineWidth = L.browW; c.lineCap = 'round';
  const P = (dx, dy) => [x + side*dx, y + dy];
  if (shape === 'short'){ ell(c, ...P(-2, 0), 6 + L.browW*0.4, 3 + L.browW*0.35); return; }
  c.beginPath();
  if (shape === 'straight'){ c.moveTo(...P(-12, 0)); c.lineTo(...P(14, 0)); }
  else if (shape === 'arched'){ c.moveTo(...P(-12, 4)); c.quadraticCurveTo(...P(2, -10), ...P(15, 4)); }
  else if (shape === 'worried'){ c.moveTo(...P(-12, -7)); c.quadraticCurveTo(...P(2, -3), ...P(14, 4)); }
  else if (shape === 'sharp'){ c.moveTo(...P(-12, 6)); c.lineTo(...P(14, -5)); }

}
function drawBangs(c, L){

  c.fillStyle = L.hairColor;
  c.beginPath();

const labelsEl = $('labels');

    state: 'idle', timer: rand(0.5, 3), onArrive: null, chatWith: null, goingHome: false,
    expr: 'normal', exprT: 0, shownExpr: '', phase: Math.random()*6, jump: 0,

function assignHome(r){
  for (const a of apartments()){
    const used = new Set(residents.filter(o => o !== r && o.home === a.id).map(o => o.room));
    for (let i = 0; i < ROOMS_PER_APT; i++) if (!used.has(i)){ r.home = a.id; r.room = i; return true; }
  }
  r.home = 0; r.room = 0; return false;
}
function homeApt(r){ let a = objs.get(r.home); if (!a || a.t !== 'apartment'){ assignHome(r); a = objs.get(r.home); } return a || null; }
function doorOf(r){ const a = homeApt(r); return a ? spotOf(a) : null; }

  return new THREE.Vector3(c.x + Math.cos(th)*lx + Math.sin(th)*lz, ly, c.z - Math.sin(th)*lx + Math.cos(th)*lz);
}
function bedTime(r){ return 21.5 + r.act*1.3; }
function wakeTime(r){ return 6 + (1 - r.act)*1.3; }

  if (r.chatWith) endChatFor(r);

  const arrive = () => { r.state = 'home'; r.goingHome = false; r.ch.root.visible = false; r.bubbleT = 0; r.path = null; };
  if (!d || !moveTo(r, d.x + rand(-0.3, 0.3), d.z, arrive)) arrive();
}
function wakeUp(r){

  if (!p || !walkableAt(p.x, p.z)){ const n = nearestWalkable(Math.floor(p ? p.x : 0), Math.floor(p ? p.z : 0), 30); p = n ? { x:n[0] + 0.5, z:n[1] + 0.5 } : { x:0, z:0 }; }
  r.state = 'idle'; r.timer = rand(0.5, 2); r.pos.set(p.x, 0, p.z); r.ch.root.visible = true;
  r.heading = r.wantHeading = d ? d.face + Math.PI : 0;
  showBubble(r, pick(['おはよう！','ふぁ〜あ','いい朝だ〜','☀️']), 2.5);

function visitSpots(){ return [...objs.values()].filter(o => ITEMS[o.t].visit); }
function decide(r){
  if (shouldSleep(r)) return goHome(r);
  const x = Math.random();
  if (r.chatCd <= 0 && x < 0.36 && tryChat(r)) return;
  if (x < 0.62){
    let sp = visitSpots().filter(o => { const s = spotOf(o); return Math.hypot(s.x - r.pos.x, s.z - r.pos.z) < 40; });
    if (r.hunger < 60){ const cafes = sp.filter(o => ITEMS[o.t].visit.food); if (cafes.length && Math.random() < 0.6) sp = cafes; }
    if (sp.length && (x > 0.42 || r.hunger < 60) && visit(r, pick(sp))) return;
  }
  if (x < 0.7){ r.state = 'idle'; r.timer = rand(2, 5); if (Math.random() < 0.5) showBubble(r, pick(['🎵','💭','…','☁️','🌼','😌']), 2); return; }
  const p = randomWalkableNear(r.pos.x, r.pos.z, 14);

function visit(r, o){

  const side = Math.random() - 0.5, th = o.rot*Math.PI/2;

// ---------- おしゃべり ----------
const chats = [];
function tryChat(a){
  const cands = residents.filter(b => b !== a && available(b) && b.chatCd <= 0 && a.pos.distanceTo(b.pos) < 14);
  if (!cands.length) return false;
  let tot = 0; const ws = cands.map(b => { const R = rel(a, b); const w = 1 + Math.max(0, R.aff)/25 + (R.lovers ? 4 : 0) - (R.aff < -10 ? 0.7 : 0); tot += w; return w; });
  let t = Math.random()*tot, b = cands[0];
  for (let i = 0; i < cands.length; i++){ t -= ws[i]; if (t <= 0){ b = cands[i]; break; } }
  return startChat(a, b);
}
function startChat(a, b, opt={}){
  const base = Math.atan2(a.pos.x - b.pos.x, a.pos.z - b.pos.z);
  let ok = false;
  for (const off of [0, 0.8, -0.8, 1.6, -1.6, Math.PI]){
    const ang = base + off, tx = b.pos.x + Math.sin(ang)*1.5, tz = b.pos.z + Math.cos(ang)*1.5;
    if (!walkableAt(tx, tz)) continue;
    if (moveTo(a, tx, tz, () => beginChat(a, b, opt))){ ok = true; break; }
  }
  if (!ok) return false;
  a.chatWith = b; b.chatWith = a;
  b.state = 'wait'; b.waitT = 16; b.path = null;
  return true;
}
function beginChat(a, b, opt){
  if (b.state !== 'wait' || b.chatWith !== a){ a.chatWith = null; a.state = 'idle'; a.timer = 1; if (opt.onEnd) opt.onEnd(0); return; }
  a.state = b.state = 'chat';
  chats.push({ a, b, t: 0, dur: opt.force ? 4.5 : rand(4.5, 7), next: 0.2, turn: 0, opt });
}
function endChatFor(r){
  const i = chats.findIndex(c => c.a === r || c.b === r);
  const o = r.chatWith;
  if (i >= 0) chats.splice(i, 1);
  for (const x of [r, o]) if (x){ x.chatWith = null; if (x.state === 'chat' || x.state === 'wait'){ x.state = 'idle'; x.timer = rand(1, 2); } }
}
function updateChats(dt){
  for (let i = chats.length - 1; i >= 0; i--){
    const c = chats[i], { a, b } = c;
    c.t += dt;
    a.wantHeading = Math.atan2(b.pos.x - a.pos.x, b.pos.z - a.pos.z);
    b.wantHeading = Math.atan2(a.pos.x - b.pos.x, a.pos.z - b.pos.z);
    if (c.t >= c.next){
      const sp = c.turn % 2 ? b : a;
      const R = rel(a, b);
      let t = pick(TOPICS);
      if (R.lovers && Math.random() < 0.4) t = pick(['💕','😊','🌹','💗']);
      if (c.opt.force === 'makeup' && c.turn === 0) t = 'ごめんね…';
      if (c.opt.force === 'makeup' && c.turn === 1) t = 'こっちこそ！';
      showBubble(sp, t, 1.2, t.length <= 2); sp.jump = 0.35; voice(sp, 3);
      c.turn++; c.next += 1.3;
    }
    if (c.t >= c.dur){ chats.splice(i, 1); finishChat(a, b, c.opt); }
  }
}
function finishChat(a, b, opt){
  const R = rel(a, b), cp = compat(a, b);
  let d;
  if (opt.force === 'good') d = Math.max(10, 32 - R.aff);
  else if (opt.force === 'makeup') d = Math.max(0, 25 - R.aff);
  else if (opt.force === 'bad') d = -6;
  else { d = Math.round((cp - 0.32)*14 + rand(-2, 4)); if (!R.lovers && cp < 0.42 && Math.random() < 0.12) d = -22; }
  addAff(a, b, d);
  a.chatWith = b.chatWith = null;
  for (const x of [a, b]){
    x.state = 'idle'; x.timer = rand(1, 2.5); x.chatCd = rand(12, 24);
    if (d <= -15){ setExpr(x, 'angry', 4); showBubble(x, '💢', 2.5, true); }
    else if (d > 0){ setExpr(x, R.lovers ? 'love' : 'happy', 2.5); addHappy(x, 2 + d*0.3); if (R.lovers) floatAt(x, '💕'); }
    else setExpr(x, 'normal', 1);

// ---------- しあわせ・レベル ----------
function addHappy(r, d){
  r.happy = clamp(r.happy + d, 0, 140);
  while (r.happy >= 100){
    r.happy -= 55; r.level++;

  if (ptrs.size === 1){
    if (Math.hypot(e.clientX - p.sx, e.clientY - p.sy) > 8) gesture.moved = true;
    if (gesture.moved){
      if (gesture.button === 2 || e.shiftKey) pan(dx, dy);
      else { cam.tYaw -= dx*0.007; cam.tPitch = clamp(cam.tPitch + dy*0.005, 0.15, 1.38); }
    }
  } else if (ptrs.size === 2){
    const [a, b] = [...ptrs.values()];
    const before = Math.hypot(a.x - b.x, a.y - b.y);
    const mx0 = (a.x + b.x)/2, my0 = (a.y + b.y)/2;
    p.x = e.clientX; p.y = e.clientY;
    const after = Math.hypot(a.x - b.x, a.y - b.y);
    if (before > 0 && after > 0) cam.tDist = clamp(cam.tDist*before/after, 5, 110);
    pan((a.x + b.x)/2 - mx0, (a.y + b.y)/2 - my0);

function pan(dx, dy){

  cam.tTarget.z += (dx*fx - dy*fz)*k;

  cam.tTarget.x = clamp(cam.tTarget.x, b.x0 - 6, b.x1 + 6);

// ---------- メインループ ----------
function simulate(dt){
  const allHome = residents.length > 0 && residents.every(r => r.state === 'home');
  const before = W.time;
  W.time += dt*2*(allHome ? 8 : 1);
  if (W.time >= 1440){
    W.time -= 1440; W.day++;
    const gift = 40*residents.length;
    W.money += gift;
    toast(`🌅 ${W.day}日目の朝！ 島のおこづかい 💰+${gift}`); news(`${W.day}日目がはじまった`);
    save();
  }
  if (Math.floor(before/60) !== Math.floor(W.time/60) && Math.floor(W.time/60) === 21) toast('🌙 夜になってきた。みんなそろそろおやすみ…');
  for (const r of residents){
    if (r.state === 'event') continue;
    if (r.state === 'home'){
      r.hunger = Math.max(0, r.hunger - dt*0.015);
      if (!shouldSleep(r)) wakeUp(r);
      continue;
    }
    r.hunger = Math.max(0, r.hunger - dt*0.06);
    r.happy = Math.max(0, r.happy - dt*(r.hunger <= 0 ? 0.08 : 0.012));
    r.chatCd -= dt; r.talkCd -= dt;
    if (r.worry){
      r.worry.life -= dt;
      if (r.worry.life <= 0){ r.worry = null; r.nextWorry = rand(50, 100); addHappy(r, -8); setExpr(r, 'sad', 3); showBubble(r, '…もういいや', 2.5); if (r === selected) renderPanel(); }
    } else if (!shouldSleep(r) && r.state !== 'chat'){
      r.nextWorry -= dt;
      if (r.nextWorry <= 0) genWorry(r);
    }
    if (shouldSleep(r) && !r.goingHome && r.state !== 'chat' && r.state !== 'focus' && r.state !== 'wait') goHome(r);
    switch (r.state){
      case 'idle': r.timer -= dt; if (r.timer <= 0) decide(r); break;
      case 'walk': stepWalk(r, dt); break;
      case 'wait':
        r.waitT -= dt;
        if (r.chatWith) r.wantHeading = Math.atan2(r.chatWith.pos.x - r.pos.x, r.chatWith.pos.z - r.pos.z);
        if (r.waitT <= 0){ const o = r.chatWith; r.chatWith = null; if (o && o.chatWith === r) o.chatWith = null; r.state = 'idle'; r.timer = 1; }
        break;
      case 'focus': r.wantHeading = Math.atan2(camera.position.x - r.pos.x, camera.position.z - r.pos.z); break;
    }
  }
  updateChats(dt);
  for (let i = 0; i < residents.length; i++){
    const a = residents[i]; if (!a.ch.root.visible || a.state === 'event') continue;
    for (let j = i + 1; j < residents.length; j++){
      const b = residents[j]; if (!b.ch.root.visible || b.state === 'event') continue;
      const dx = b.pos.x - a.pos.x, dz = b.pos.z - a.pos.z, d = Math.hypot(dx, dz);
      if (d > 0.001 && d < 0.9){
        const push = (0.9 - d)/2, ux = dx/d*push, uz = dz/d*push;
        if (walkableAt(a.pos.x - ux, a.pos.z - uz)){ a.pos.x -= ux; a.pos.z -= uz; }
        if (walkableAt(b.pos.x + ux, b.pos.z + uz)){ b.pos.x += ux; b.pos.z += uz; }
      }
    }
  }
}
function stepWalk(r, dt){
  if (!r.path || !r.path.length){ r.state = 'idle'; r.timer = 1; return; }
  let step = (1.3 + r.act*1.1)*dt;
  while (r.path.length){
    const t = r.path[0], dx = t.x - r.pos.x, dz = t.z - r.pos.z, d = Math.hypot(dx, dz);
    if (d <= step){ r.pos.x = t.x; r.pos.z = t.z; step -= d; r.path.shift(); continue; }
    r.pos.x += dx/d*step; r.pos.z += dz/d*step; r.wantHeading = Math.atan2(dx, dz);
    return;
  }
  r.state = 'idle'; r.timer = rand(1.5, 4); r.path = null;
  const cb = r.onArrive; r.onArrive = null; if (cb) cb();
}
function animate(dt, now){
  const t = now/1000;
  for (const r of residents){
    const ch = r.ch;
    if (!ch.root.visible) continue;
    r.heading += angDiff(r.heading, r.wantHeading)*Math.min(1, dt*8);
    const walking = r.state === 'walk';
    if (walking) r.phase += dt*(7 + r.act*3);
    r.jump = Math.max(0, r.jump - dt);
    const jy = r.jump > 0 ? Math.sin((1 - r.jump/0.6)*Math.PI)*0.3*Math.min(1, r.jump*3) : 0;
    const sw = walking ? Math.sin(r.phase) : 0;
    const bob = walking ? Math.abs(Math.cos(r.phase))*0.05 : Math.sin(t*2 + r.pitch*6)*0.008;
    ch.root.position.set(r.pos.x, jy, r.pos.z);
    ch.root.rotation.y = r.heading;
    ch.torso.position.y = ch.hipY + bob;
    ch.legs[0].rotation.x = sw*0.6; ch.legs[1].rotation.x = -sw*0.6;
    const talking = r.state === 'chat' && r.bubbleT > 0;
    const cheer = r.expr === 'happy' || r.expr === 'love';
    for (let i = 0; i < 2; i++){
      const s = i ? 1 : -1, arm = ch.arms[i];
      arm.rotation.x = walking ? (i ? sw : -sw)*0.6 : 0;
      let raise = 0.12;
      if (talking) raise = 0.4 + Math.abs(Math.sin(t*9 + i))*0.5;
      else if (cheer) raise = 0.6 + Math.abs(Math.sin(t*6))*0.5;
      arm.rotation.z = s*raise;
    }
    ch.head.rotation.z = talking ? Math.sin(t*4)*0.08 : r.expr === 'sad' ? 0.1 : 0;
    ch.head.rotation.x = r.expr === 'sad' ? 0.15 : 0;
    if (r.exprT > 0){ r.exprT -= dt; if (r.exprT <= 0) r.expr = 'normal'; }
    let e = r.expr === 'normal' ? baseExpr(r) : r.expr;
    const blink = (t + r.pitch*7) % 4 < 0.12;
    if (blink && e === 'normal') e = 'sleep';
    if (r.shownExpr !== e){ drawFace(ch.cv, r.look, e); ch.tex.needsUpdate = true; r.shownExpr = e; }
    if (r.bubbleT > 0) r.bubbleT -= dt;
  }
}
function updateLabels(dt){
  for (const r of residents){
    const el = r.el;
    if (!r.ch.root.visible){ if (el.style.display !== 'none') el.style.display = 'none'; continue; }
    const s = toScreen(r.pos.x, r.ch.root.position.y + r.ch.topY + 0.2, r.pos.z);
    if (!s.ok || s.x < -100 || s.x > innerWidth + 100 || s.y < -60 || s.y > innerHeight + 60){ if (el.style.display !== 'none') el.style.display = 'none'; continue; }
    if (el.style.display === 'none') el.style.display = '';
    el.style.transform = `translate(${s.x}px, ${s.y}px) translate(-50%, -100%)`;
    let txt = '', cls = 'bub';
    if (r.bubbleT > 0){ txt = r.bubble; if (r.bubbleBig) cls += ' big'; }
    else if (r.worry && r.state !== 'event'){ txt = r.worry.icon; cls += ' worry'; }
    const lab = cls + '|' + txt;
    if (lab !== r.lastLabel){ r.lastLabel = lab; r.bubEl.className = cls; r.bubEl.textContent = txt; r.bubEl.style.display = txt ? 'block' : 'none'; }
    el.classList.toggle('sel', r === selected);
  }
  for (let i = floats.length - 1; i >= 0; i--){
    const f = floats[i]; f.t += dt;
    if (f.t >= f.life || !f.r.ch.root.visible){ f.el.remove(); floats.splice(i, 1); continue; }
    const s = toScreen(f.r.pos.x + f.dx, f.r.ch.topY - 0.2 + f.t*1.2, f.r.pos.z);
    f.el.style.transform = `translate(${s.x}px, ${s.y}px) translate(-50%, -50%) scale(${0.8 + Math.min(1, f.t*4)*0.4})`;
    f.el.style.opacity = String(1 - Math.max(0, f.t - f.life*0.6)/(f.life*0.4));
  }
}
const sunCol = new THREE.Color();
function updateWorld(dt, t){
  const h = W.time/60, nf = nightFactor(h), sky = skyAt(h);
  scene.background = sky; scene.fog.color.copy(sky);
  const a = (h - 6)/12*Math.PI, day = Math.max(0, Math.sin(a));
  if (day > 0.05) sun.position.set(Math.cos(a)*40 + cam.target.x, Math.max(8, Math.sin(a)*45), 18 + cam.target.z);
  else sun.position.set(-20 + cam.target.x, 40, 20 + cam.target.z);
  sun.target.position.set(cam.target.x, 0, cam.target.z);
  sun.intensity = lerp(0.62, 0.25, nf);
  sunCol.set('#fff4e0').lerp(cA.set('#9fb2ff'), nf); sun.color.copy(sunCol);
  hemi.intensity = lerp(0.5, 0.3, nf);
  hemi.color.set('#ffffff').lerp(cB.set('#7d8cd6'), nf);
  stars.material.opacity = Math.max(0, nf - 0.4)*1.6;
  for (const o of objs.values()){
    const u = o.mesh.userData;
    if (u.bulb) u.bulb.emissiveIntensity = nf*1.1;
    if (u.win){
      for (let i = 0; i < u.win.length; i++){
        const r = residents.find(x => x.home === o.id && x.room === i);
        const lit = r && r.state === 'home' && nf > 0.2 && h > 12;
        const m = u.win[i];
        m.emissiveIntensity = lerp(m.emissiveIntensity, lit ? 0.9 : 0, Math.min(1, dt*3));
        m.color.set(nf > 0.5 ? '#3d4a7a' : '#a9dcf5');
      }
    }
    if (u.spout){ const s = 1 + Math.sin(t*6)*0.08; u.spout.scale.set(s, 1/s, s); u.water.position.y = 0.55 + Math.sin(t*3)*0.02; }
    if (u.swings) u.swings.forEach((s, i) => s.rotation.x = Math.sin(t*2 + i*1.7)*0.35);
  }
  const pos = sea.geometry.attributes.position;
  for (let i = 0; i < pos.count; i++){ const x = seaBase[i*3], z = seaBase[i*3 + 2]; pos.array[i*3 + 1] = Math.sin(x*0.15 + t*1.2)*0.18 + Math.cos(z*0.13 + t*0.9)*0.18; }
  pos.needsUpdate = true; sea.geometry.computeVertexNormals();
  sea.material.color.set('#46aee6').lerp(cA.set('#1d2c5c'), nf*0.8);
  for (const c of clouds){ c.position.x += c.userData.v*dt; if (c.position.x > 130) c.position.x = -130; }
  const icon = h >= 5 && h < 17 ? '☀️' : h >= 17 && h < 19.5 ? '🌇' : '🌙';
  $('clock').textContent = `${icon} ${W.day}日目 ${clockText()}`;
  $('money').textContent = `💰 ${W.money}`;
}
function updateCamera(dt){
  if (followRes && followRes.ch.root.visible) cam.tTarget.set(followRes.pos.x, 1.3, followRes.pos.z);
  else if (followRes && followRes.state === 'home'){ const w = windowPos(followRes); if (w) cam.tTarget.copy(w); }
  const k = 1 - Math.exp(-dt*5);
  cam.yaw += angDiff(cam.yaw, cam.tYaw)*k; cam.pitch = lerp(cam.pitch, cam.tPitch, k); cam.dist = lerp(cam.dist, cam.tDist, k);
  cam.target.lerp(cam.tTarget, k);
  camera.position.set(
    cam.target.x + Math.sin(cam.yaw)*Math.cos(cam.pitch)*cam.dist,
    cam.target.y + Math.sin(cam.pitch)*cam.dist,
    cam.target.z + Math.cos(cam.yaw)*Math.cos(cam.pitch)*cam.dist);
  camera.lookAt(cam.target);
  const open = panel.classList.contains('open');
  const wide = innerWidth >= 760;
  const tx = open && wide ? (panel.offsetWidth + 16)/2 : 0;
  const ty = open && !wide ? panel.offsetHeight/2 : build.on && !wide ? $('buildbar').offsetHeight/2 : 0;
  cam.offX = lerp(cam.offX, tx, k); cam.offY = lerp(cam.offY, ty, k);
  if (Math.abs(cam.offX) > 0.5 || Math.abs(cam.offY) > 0.5) camera.setViewOffset(innerWidth, innerHeight, cam.offX, cam.offY, innerWidth, innerHeight);
  else camera.clearViewOffset();
}
function resize(){ renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); }
window.addEventListener('resize', resize);

let last = performance.now(), saveT = 0, panelT = 0, uiT = 0;
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  if (!busy) simulate(dt*W.speed);
  animate(dt, now);
  updateCamera(dt);
  updateWorld(dt, now/1000);
  renderer.render(scene, camera);
  updateLabels(dt);
  if (prev && prev.on && prev.ch){
    prev.t += dt; prev.zoom = lerp(prev.zoom, prev.tzoom, Math.min(1, dt*6));
    if (prev.drag === null) prev.rotY = lerp(prev.rotY, Math.sin(prev.t*0.8)*0.5, Math.min(1, dt*1.5));
    prev.ch.root.rotation.y = prev.rotY;
    const hy = prev.ch.hipY + prev.ch.torso.children[0].scale.y + 0.12 + HR*0.88;
    prev.c.position.set(0, lerp(1.3, hy + 0.05, prev.zoom), lerp(6.0, 3.3, prev.zoom));
    prev.c.lookAt(0, lerp(1.12, hy, prev.zoom), 0);
    prev.r.render(prev.s, prev.c);
  }
  panelT += dt;
  if (selected && panelT > 0.4){ panelT = 0; if (sigOf(selected) !== panelSig) renderPanel(); else updateBars(); }
  uiT += dt; if (build.on && uiT > 0.5){ uiT = 0; updateBuildUI(); }
  saveT += dt; if (saveT > 8){ saveT = 0; save(); }
}

// ---------- はじまり ----------
function defaultWorld(){
  for (let x = -3; x <= 2; x++) for (let z = -3; z <= 2; z++) addChunk(x, z);
  const P = (t, ox, oz, rot=0) => placeObj(t, ox, oz, rot);
  P('plaza', -6, -6);
  P('fountain', -3, -3);
  P('apartment', -6, -20, 0);
  for (const oz of [-14, -12, -10, -8]) P('stone', -1, oz);
  P('cafe', 12, -3, 3);
  for (const ox of [6, 8, 10]) P('stone', ox, -1);
  P('hatshop', -18, -3, 1);
  for (const ox of [-8, -10, -12]) P('stone', ox, -1);
  for (let oz = 6; oz <= 20; oz += 2) P('path', -1, oz);
  P('bench', -6, 7, 2); P('bench', 4, 7, 2); P('bench', -6, -8, 0); P('bench', 4, -8, 0);
  for (const [x, z] of [[-7, -7], [6, -7], [-7, 6], [6, 6]]) P('lamp', x, z);
  P('pond', 9, 11);
  P('swing', -14, 10, 0);
  const sr = seeded(0.123);
  let n = 0;
  for (let k = 0; k < 900 && n < 46; k++){
    const i = Math.floor(-24 + sr()*48), j = Math.floor(-24 + sr()*48);
    if (Math.hypot(i + 0.5, j + 0.5) < 13) continue;
    if (Math.abs(i) < 3 && j > -15) continue;           // 南の道
    if (Math.abs(j) < 4 && Math.abs(i) < 19) continue;  // お店の前
    if (!canPlace('tree', i, j, 0)) continue;
    const t = n % 6 === 5 ? 'bush' : n % 4 === 3 ? 'pine' : n % 9 === 8 ? 'palm' : 'tree';
    P(t, i, j); n++;
  }
  for (let k = 0, m = 0; k < 500 && m < 30; k++){
    const i = Math.floor(-22 + sr()*44), j = Math.floor(-22 + sr()*44);
    if (Math.hypot(i, j) < 7) continue;
    if (canPlace('flower', i, j, 0)){ P('flower', i, j); m++; }
  }
}

  const base = [

      brows:'normal', browW:5, nose:'dot', mouth:'grin', cheek:true, freckles:false, mole:false, glasses:'none', body:'normal', height:1.02, top:'#ffb74d', bottomType:'pants', bottom:'#3949ab', shoes:'#ffffff', hat:'cap' }, act:.8, care:.7, fav:'ramen', dislike:'straw' },

    { name:'コタ', look:{ face:'wide', skin:'#c98a5e', hair:'spiky', bangs:'spiky', hairColor:'#d9a650', eyes:'cat', eyeColor:'#3e8f5e', eyeSize:0.95, eyeGap:0.5, eyeY:0.45, lashes:0,
      brows:'sharp', browW:7, nose:'round', mouth:'open', cheek:false, freckles:true, mole:false, glasses:'none', body:'chubby', height:0.98, top:'#aed581', bottomType:'shorts', bottom:'#6d4c41', shoes:'#5d4037', hat:'leaf' }, act:.9, care:.3, fav:'curry', dislike:'apple' },
  ];
  const ap = apartments()[0];
  W.residents = base.map((b, i) => Object.assign({ id:'r' + (W.nextId++), level:1, happy:55, hunger:70 - i*12, home: ap ? ap.id : 0, room:i }, b));
  W.rel = {};
  const [a, b, c, d] = W.residents;
  W.rel[[a.id, b.id].sort().join('|')] = { aff:42, lovers:false };
  W.rel[[a.id, d.id].sort().join('|')] = { aff:18, lovers:false };
  W.rel[[b.id, c.id].sort().join('|')] = { aff:12, lovers:false };
  news('まめじまでのくらしがはじまった！');

let resetting = false;
function start(){
  buildSky();
  if (load()){
    for (const k of W.land){ const [x, z] = k.split(',').map(Number); addChunk(x, z); }
    for (const o of W.objects) if (ITEMS[o.t]) placeObj(o.t, o.ox, o.oz, o.rot, o.id);
  } else {
    defaultWorld(); initResidents();
  }
  for (const d of W.residents){
    const p = randomWalkableNear(0, 0, 12) || { x:0, z:6 };
    const r = spawnResident(d, p.x, p.z);
    if (!objs.get(r.home)) assignHome(r);
    if (shouldSleep(r)){ r.state = 'home'; r.ch.root.visible = false; }
  }
  resize();
  const b = landBBox();
  cam.tTarget.set(b.cx, 0, b.cz + 2); cam.target.copy(cam.tTarget); cam.dist = cam.tDist = homeDist();
  requestAnimationFrame(loop);
  if (!W.seenHelp) openHelp();
}
document.addEventListener('visibilitychange', () => { if (document.hidden && !resetting) save(); });
window.addEventListener('pagehide', () => { if (!resetting) save(); });
start();
